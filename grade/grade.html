<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="grade.css">
</head>
<body>
    <h1>Grade Calculator</h1>
    <label for="mark">Enter your mark:</label>
    <input type="number" id="mark" name="mark" >
    <button onclick="calculateGrade()">Calculate Grade</button>
    <p id="result"></p>

    <script>
        function calculateGrade(){
            let mark = document.getElementById("mark").value;
            let grade;

            if(mark < 0 || mark > 100){
                document.getElementById("result").innerText = "Please enter a valid mark between 0 and 100.";
                return;
            }
            if(mark >= 90){
                grade = "A";
            }
            else if(mark >= 80){
                grade = "B";
            }
            else if(mark >= 70){
                grade = "C";
            }
            else if(mark >= 60){
                grade = "D";
            }
            else{
                grade = "Fail";
            }
            document.getElementById("result").innerText = `Your grade is: ${grade}`;
        }
    </script>
</body>
</html>
