<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Cinemas</title>
    <link rel="stylesheet" href="homepage.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="SK Cinemas Logo">SK Cinemas</a>
        </div>
        <div class="nav">
            <ul>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </div>
        <div class="search">
            <input type="text" placeholder="Search for movies...">
            <button type="submit">Search</button>
        </div>
        <div class="login">
            <a href="login.html">Login</a>
        </div>
    </header>
    <main>
        <section class="hero">
            <h1>Welcome to SK Cinemas</h1>
            <p>Your ultimate destination for movie entertainment!</p>
            <a href="movies.html" class="btn">Explore Movies</a>
        </section>

        <section class="slideshow">
            <div class="slides">
                <img src="https://www.shutterstock.com/image-photo/pristine-cinema-hall-rows-plush-600nw-2476858211.jpg" alt="Cinema Experience 1">
                <img src="https://www.ivpartners.in/portfolio/entertainment/cinema-l-t-metro-mall-hyderabad/images/9.jpg" alt="Cinema Experience 2">
                <img src="https://i.pinimg.com/originals/7b/37/50/7b375096b28899c89288acc488680537.jpg" alt="Cinema Experience 3">
                <img src="https://i.ytimg.com/vi/zbOx-mTqus0/maxresdefault.jpg" alt="Cinema Experience 4">
            </div>
        </section>

        <section class="featured-movies">
            <h2>Featured Movies</h2>
            <div class="movie-list">
                <div class="movie-item">
                    <img src="https://imgengine.khaleejtimes.com/khaleejtimes-english/2025-07-23/h758g7se/GwhCuMpbEAI7b5P.jpeg?width=1200&height=800&format=auto" alt="Karuppu Movie Poster">
                    <h3>Karuppu</h3>
                    <p>Genre: Action, Drama</p>
                </div>
                 <div class="movie-item">
                    <img src="https://images.filmibeat.com/ph-big/2026/02/seyon1771244275_0.jpeg" alt="Seyon Movie Poster">
                    <h3>Seyon</h3>
                    <p>Genre: Action, Drama</p>
                </div>
                 <div class="movie-item">
                    <img src="https://m.media-amazon.com/images/M/MV5BMDZiNzAwZTQtYWIwMC00ODA0LWJiOGMtZTgzZGYzYzMxMDNiXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Toxic Movie Poster">
                    <h3>Toxic</h3>
                    <p>Genre: Fantasy, Drama</p>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
    <footer>
        <p>&copy; 2026 SK Cinemas. All rights reserved.</p>
    </footer>
